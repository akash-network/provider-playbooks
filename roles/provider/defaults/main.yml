---
helm_install_version: v4.2.4
helm_install_script: get-helm-4

# Gateway API / NGINX Gateway Fabric (replaces ingress-nginx for provider edge)
ngf_version: "2.6.7"
cert_manager_chart_version: v1.19.1

akash_node_chart_version: "18.0.0"
akash_gateway_chart_version: "1.2.1"
akash_provider_chart_version: "19.0.2"
akash_hostname_operator_chart_version: "19.0.2"
akash_inventory_operator_chart_version: "19.0.2"
provider_version: "0.16.2"

# ACME / Let's Encrypt — set by setup_provider.sh (host_vars) or override manually
# acme_dns_provider: none | cloudflare | gcp
acme_dns_provider: none

# defaults file for provider
node: "http://akash-node-1:26657"

withdrawal_period: "12h"
chain_id: "akashnet-2"

# provider attributes
attributes:
  - key: host
    value: akash
  - key: tier
    value: community

# price targets
price_cpu: 1.60
price_memory: 0.30
price_hd_ephemeral: 0.02
price_hd_pers_hdd: 0.01
price_hd_pers_ssd: 0.03
price_hd_pers_nvme: 0.1
price_endpoint: 0.05
price_ip: 5
