---
- name: Discover the requested persistent storage class
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ storage_class_name }}"
  register: akash_storage_classes
  when: has_persistent_storage | default(false) | bool

- name: Require the requested persistent storage class
  ansible.builtin.assert:
    that:
      - akash_storage_classes.resources is defined
      - akash_storage_classes.resources | length == 1
      - akash_storage_classes.resources[0].metadata.labels['akash.network'] | default('') == 'true'
    fail_msg: "Persistent storage was requested, but the Akash-labelled storage class is unavailable."
  when: has_persistent_storage | default(false) | bool

- name: Validate persistent storage provisioning
  ansible.builtin.import_tasks: validate_storage.yml
  when: has_persistent_storage | default(false) | bool

- name: Check allocatable NVIDIA GPUs
  ansible.builtin.shell: >-
    kubectl get nodes -o json |
    jq '[.items[].status.allocatable["nvidia.com/gpu"] // "0" | tonumber] | add'
  args:
    executable: /bin/bash
  register: allocatable_gpu_count
  changed_when: false
  when: has_gpu | default(false) | bool

- name: Require canonical GPU profiles before advertising GPUs
  ansible.builtin.assert:
    that:
      - gpu_profiles is defined
      - gpu_profiles | length > 0
      - cuda_version is defined
    fail_msg: "GPU attributes were requested, but canonical detected profiles or the CUDA attribute are missing."
  when: has_gpu | default(false) | bool

- name: Display provider capability summary
  ansible.builtin.debug:
    msg:
      persistent_storage: "{{ has_persistent_storage | default(false) }}"
      storage_class: "{{ storage_class_name | default('none') }}"
      gpu: "{{ has_gpu | default(false) }}"
      allocatable_gpus: "{{ allocatable_gpu_count.stdout | default('0') }}"
      shared_memory: true
