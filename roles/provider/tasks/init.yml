---
- name: Check if node has control-plane label
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl get node {{ kubernetes_node_name | default(inventory_hostname) | quote }}
    --no-headers -o custom-columns=LABELS:.metadata.labels |
    grep -q 'node-role.kubernetes.io/control-plane\|node-role.kubernetes.io/master'
  args:
    executable: /bin/bash
  register: control_plane_check
  failed_when: false
  changed_when: false

- name: Fail if not a control plane node
  ansible.builtin.fail:
    msg: "This task can only be run on a Kubernetes control plane node"
  when: control_plane_check.rc != 0

- name: Log pinned provider version
  ansible.builtin.debug:
    msg: "Using pinned provider version: {{ provider_version }}"

- name: Load provider keys retrieved by the optional 1Password play
  ansible.builtin.set_fact:
    provider_b64_key: >-
      {{ provider_b64_key | default(hostvars['localhost'].provider_b64_key | default('')) }}
    provider_b64_keysecret: >-
      {{ provider_b64_keysecret | default(hostvars['localhost'].provider_b64_keysecret | default('')) }}
  no_log: true

- name: Require provider key material
  ansible.builtin.assert:
    that:
      - provider_b64_key | length > 0
      - provider_b64_keysecret | length > 0
    fail_msg: >-
      Provider credentials were not found. Run the op role first or define
      provider_b64_key and provider_b64_keysecret in protected host variables.
  no_log: true
