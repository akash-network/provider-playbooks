---
# Tasks for deploying the Rook-Ceph operator
- name: Template Rook-Ceph operator Helm values file
  template:
    src: rook-ceph-operator.values.yml.j2
    dest: /tmp/rook-ceph-operator.values.yml

- name: Create Rook-Ceph namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ rook_ceph_namespace }}"

- name: Add Rook Helm repo
  kubernetes.core.helm_repository:
    name: rook-release
    repo_url: https://charts.rook.io/release
    state: present
    force_update: true

- name: Install Rook Ceph Operator Helm chart
  kubernetes.core.helm:
    name: rook-ceph-operator
    chart_ref: rook-release/rook-ceph
    release_namespace: "{{ rook_ceph_namespace }}"
    create_namespace: true
    chart_version: "{{ rook_ceph_version }}"
    values_files:
      - /tmp/rook-ceph-operator.values.yml
    wait: true
    wait_timeout: 600s
    state: present

- name: Wait for Rook-Ceph operator to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: rook-ceph-operator
    namespace: "{{ rook_ceph_namespace }}"
  register: operator
  until:
    - operator.resources is defined
    - operator.resources | length > 0
    - operator.resources[0].status is defined
    - operator.resources[0].status.readyReplicas is defined
    - operator.resources[0].status.readyReplicas > 0
  retries: 30
  delay: 10

- name: Find existing Ceph deployments managed by Rook
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ rook_ceph_namespace }}"
    label_selectors:
      - "rook_cluster={{ rook_ceph_namespace }}"
  register: rook_ceph_managed_deployments
  until:
    - rook_ceph_managed_deployments.resources | default([]) | length > 0
  retries: 30
  delay: 5
  when:
    - rook_ceph_existing_cluster | bool
    - rook_ceph_upgrade_required | bool

- name: Wait for existing Ceph deployments to finish the Rook upgrade
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.metadata.name }}"
    namespace: "{{ rook_ceph_namespace }}"
  register: rook_ceph_managed_deployment
  until:
    - rook_ceph_managed_deployment.resources | default([]) | length == 1
    - >-
      rook_ceph_managed_deployment_state.get('metadata', {}).get('labels', {})
      .get('rook-version', '') ==
      ('v' ~ rook_ceph_version)
    - >-
      rook_ceph_managed_deployment_state.get('spec', {}).get('replicas', 0) | int ==
      rook_ceph_managed_deployment_state.get('status', {}).get('updatedReplicas', 0) | int
    - >-
      rook_ceph_managed_deployment_state.get('spec', {}).get('replicas', 0) | int ==
      rook_ceph_managed_deployment_state.get('status', {}).get('readyReplicas', 0) | int
    - >-
      rook_ceph_managed_deployment_state.get('spec', {}).get('replicas', 0) | int ==
      rook_ceph_managed_deployment_state.get('status', {}).get('availableReplicas', 0) | int
  retries: 120
  delay: 10
  loop: "{{ rook_ceph_managed_deployments.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  vars:
    rook_ceph_managed_deployment_state: >-
      {{ rook_ceph_managed_deployment.resources | default([]) | first | default({}) }}
  when:
    - rook_ceph_existing_cluster | bool
    - rook_ceph_upgrade_required | bool
