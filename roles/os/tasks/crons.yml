---
- name: Copy scripts to /usr/local/bin and make them executable
  ansible.builtin.copy:
    src: kill_zombie_parents.sh
    dest: /usr/local/bin/kill_zombie_parents.sh
    mode: '0755'
    owner: root
    group: root

- name: Create zombie cleanup cron job
  ansible.builtin.copy:
    dest: /etc/cron.d/kill_zombie_parents
    content: |
      PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
      SHELL=/bin/bash
      */5 * * * * root /usr/local/bin/kill_zombie_parents.sh | logger -t kill_zombie_parents
    owner: root
    group: root
    mode: '0644'
